<style>
/* ============================================================
   VARIABLES e IDENTIDAD VISUAL (OPTINET PREMIUM)
   ============================================================ */
:root {
  --blue:       #0033A0;
  --blue-dark:  #001E5C;
  --blue-mid:   #0050C8;
  --cyan:       #00A9E0;
  --orange:     #F58220;
  --orange-dk:  #D96C10;
  --green:      #2E7D32;
  --green-lt:   #7AB800;
  --red:        #C62828;
  --yellow:     #F9A825;
  --bg:         #EEF2F9;
  --card:       #FFFFFF;
  --border:     #D0D9EC;
  --txt:        #1A2B4A;
  --txt-muted:  #5A6E8C;
  --shadow:     0 2px 12px rgba(0,30,100,.10);
  --shadow-lg:  0 6px 24px rgba(0,30,100,.15);
  --radius:     12px;
  --radius-sm:  8px;
  --sidebar-w:  260px;
  --header-h:   64px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
}
.hidden { display: none !important; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; }

/* ============================================================
   PANTALLA DE ACCESO (LOGIN)
   ============================================================ */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 50%, var(--cyan) 100%);
  padding: 20px;
}
.login-card {
  background: #fff;
  border-radius: 20px;
  padding: 40px 36px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 24px 64px rgba(0,0,0,.3);
  text-align: center;
}
.login-logo img {
  width: 90px;
  height: 90px;
  object-fit: contain;
  margin-bottom: 8px;
}
.login-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--blue-dark);
  letter-spacing: -0.5px;
}
.login-title span { color: var(--orange); }
.login-sub {
  font-size: 12px;
  font-weight: 700;
  color: var(--txt-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.login-meaning {
  font-size: 11px;
  color: var(--blue-mid);
  font-style: italic;
  margin-bottom: 24px;
  line-height: 1.4;
}
.form-group { margin-bottom: 16px; text-align: left; }
.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--txt-muted);
  text-transform: uppercase;
  margin-bottom: 5px;
}
.form-group input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  background: #F8FAFF;
}
.form-group input:focus { outline: none; border-color: var(--blue); background: #fff; }

/* Botones universales */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border: none; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; transition: all .2s; white-space: nowrap;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dark); }
.btn-orange { background: var(--orange); color: #fff; }
.btn-orange:hover { background: var(--orange-dk); }
.btn-green { background: var(--green); color: #fff; }
.btn-outline { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
.btn-outline:hover { background: var(--blue); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 14px 24px; font-size: 15px; width: 100%; }

/* ============================================================
   ARQUITECTURA DE INTERFAZ (ESCRITORIO / WEB GLOBAL)
   ============================================================ */
#app-shell { display: flex; flex-direction: column; min-height: 100vh; }
.app-header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  background: var(--blue-dark); color: #fff; display: flex; align-items: center;
  padding: 0 24px; gap: 12px; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.header-brand { display: flex; align-items: center; gap: 10px; flex: 1; }
.header-brand-text { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
.header-brand-text span { color: var(--orange); }

/* Menú hamburguesa (Visible solo en entornos móviles) */
.menu-toggle-btn {
  display: none; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;
}

.header-user { display: flex; align-items: center; gap: 14px; font-size: 13px; }
.header-user-info { text-align: right; }
.header-user-info .uname { font-weight: 700; }
.header-user-info .urole { font-size: 11px; color: var(--cyan); font-weight: 600; }

/* BARRA LATERAL (SIDEBAR FINA DE ESCRITORIO) */
.app-sidebar {
  position: fixed; top: var(--header-h); left: 0; bottom: 0; width: var(--sidebar-w);
  background: #0d1b3e; overflow-y: auto; z-index: 90; display: flex; flex-direction: column; 
  border-right: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s ease;
}
.sidebar-section-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: rgba(255,255,255,.4); padding: 16px 16px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  color: rgba(255,255,255,.75); font-size: 14px; font-weight: 500;
  border: none; background: none; width: 100%; text-align: left; transition: all .2s;
  border-left: 4px solid transparent;
}
.nav-item:hover { background: rgba(255,255,255,.05); color: #fff; }
.nav-item.active { background: rgba(0,169,224,.15); color: #fff; border-left-color: var(--orange); font-weight: 700; }

/* CONTENEDOR CENTRAL WEB */
.app-main { margin-left: var(--sidebar-w); margin-top: var(--header-h); padding: 32px; min-height: calc(100vh - var(--header-h)); }

/* TARJETAS, DISEÑOS DE GRILLAS Y RECUENTOS */
.card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
.card-title { font-size: 16px; font-weight: 700; color: var(--blue-dark); }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 24px; }
.kpi-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border-left: 4px solid var(--cyan); }
.kpi-card.kpi-good { border-left-color: var(--green); }
.kpi-card.kpi-bad  { border-left-color: var(--red); }
.kpi-label { font-size: 11px; font-weight: 600; color: var(--txt-muted); text-transform: uppercase; }
.kpi-value { font-size: 32px; font-weight: 800; margin: 6px 0; color: var(--blue-dark); }

.table-wrap { overflow-x: auto; margin-top: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #fff; }
thead th { background: var(--blue-dark); color: #fff; padding: 12px 14px; text-align: left; font-weight: 600; }
tbody td { padding: 12px 14px; border-bottom: 1px solid #EEF2F9; color: var(--txt); }
tbody tr:hover td { background: rgba(245, 130, 32, 0.03); }

.pill { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.pill-pend { background: #FFF3E0; color: #E65100; }
.pill-prog { background: #E3F2FD; color: #0277BD; }
.pill-done { background: #E8F5E9; color: #2E7D32; }
.pill-crit { background: #FFEBEE; color: #C62828; }

/* CONFIGURACIÓN FORMULARIOS */
.form-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.form-col { flex: 1; min-width: 200px; }
.form-col label { display: block; font-size: 12px; font-weight: 600; color: var(--txt-muted); margin-bottom: 6px; }
.form-col input, .form-col select, .form-col textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: #F8FAFF; }
.form-col input:focus, .form-col select:focus { outline: none; border-color: var(--blue); background: #fff; }

.check-grid-planilla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.planilla-row-item { display: flex; align-items: center; justify-content: space-between; background: #F8FAFF; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.planilla-ok-nok { display: flex; gap: 12px; font-weight: 600; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 750px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg); }

/* ============================================================
   DISEÑO ADAPTATIVO (MEDIA QUERIES INTEGRADOS DISPOSITIVOS)
   ============================================================ */
@media (max-width: 1024px) {
  .app-sidebar { transform: translateX(-100%); }
  .app-sidebar.open { transform: translateX(0); }
  .app-main { margin-left: 0; padding: 20px; }
  .menu-toggle-btn { display: block; }
}

@media (max-width: 768px) {
  .check-grid-planilla { grid-template-columns: 1fr; }
  .form-row { flex-direction: column; gap: 12px; }
}
</style>
</head>

<script>
/* ============================================================
   CAPA DE SINCRONIZACIÓN FIREBASE REALTIME ENGINE
   ============================================================ */
const firebaseConfig = {
  databaseURL: "https://optinet-gpon-default-rtdb.firebaseio.com/" 
};

let rtdb = null;
try {
  if (firebase.apps.length === 0) {
    firebase.initializeApp(firebaseConfig);
  }
  rtdb = firebase.database();
} catch (e) {
  console.warn("Conmutando a capa local tolerante a fallas.");
}

const ZONES = ['ALTAVISTA','EL CALLAO','EL GURI','LA SABANITA','PUERTO ORDAZ','UNARE','UPATA'];

const FAULT_CATEGORIES = {
  'LOS':  { label: 'Pérdida de Señal PON (LOS)', sev: 1, proc: 'MC-02', color: '#B71C1C' },
  'CORTE':{ label: 'Corte de Cable', sev: 1, proc: 'MC-03', color: '#B71C1C' },
  'OLT_FALLA': { label: 'Falla Total OLT', sev: 1, proc: 'MC-01', color: '#B71C1C' },
  'NNV':  { label: 'No Navega (NNV)', sev: 2, proc: 'MC-04', color: '#C62828' },
  'NONAV':{ label: 'Sin Navegación (NONAV)', sev: 2, proc: 'MC-04', color: '#E65100' },
  'TELIP': { label: 'Falla Telefonía IP', sev: 3, proc: 'MC-04', color: '#0277BD' },
  'ONT_DANADO': { label: 'ONT Dañada', sev: 4, proc: 'MC-04', color: '#F57F17' },
  'NL':   { label: 'Navega Lento (NL)', sev: 5, proc: 'MC-05', color: '#9C27B0' },
  'DEGRAD': { label: 'Degradación de Señal', sev: 5, proc: 'MC-05', color: '#6A1B9A' }
};

let DB = {
  users: [
    {user:'admin', pass:'admin123', role:'admin', name:'Gerente General', zona:'Todas'},
    {user:'gerente_unare', pass:'gerente123', role:'gerente_zona', name:'Gerente Zonal Unare', zona:'UNARE'},
    {user:'tecnico1', pass:'tec123', role:'tecnico', name:'José Rangel', zona:'UNARE'}
  ],
  averias: [],
  ordenes: []
};

let SESSION = null;

function syncData(action = 'pull', callback = null) {
  if (rtdb) {
    if (action === 'push') {
      rtdb.ref('optinet_db').set(DB);
    } else {
      rtdb.ref('optinet_db').on('value', snapshot => {
        const data = snapshot.val();
        if (data) {
          DB = data;
          if (callback) callback();
        }
      });
    }
  } else {
    if (action === 'push') {
      localStorage.setItem('optinet_local_db', JSON.stringify(DB));
    } else {
      const local = localStorage.getItem('optinet_local_db');
      if (local) DB = JSON.parse(local);
      if (callback) callback();
    }
  }
}

function toggleMobileSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('open');
}

/* ============================================================
   AUTENTICACIÓN Y FILTRADO ESTRUCTURAL DE PESTAÑAS (ROLES)
   ============================================================ */
function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  
  const found = DB.users.find(x => x.user === u && x.pass === p);
  if (!found) { alert('Credenciales incorrectas o problemas de conexión.'); return; }
  
  SESSION = found;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  document.getElementById('header-name').textContent = found.name;
  
  let roleText = 'Técnico de Campo';
  if (found.role === 'admin') roleText = 'Gerente General (Nacional)';
  if (found.role === 'gerente_zona') roleText = `Gerente de Zona · ${found.zona}`;
  document.getElementById('header-role').textContent = roleText;
  
  buildHierarchicalMenu();
}

function doLogout() {
  SESSION = null;
  location.reload();
}

function buildHierarchicalMenu() {
  const nav = document.getElementById('nav-items');
  nav.innerHTML = '';
  
  let menu = [];
  if (SESSION.role === 'admin') {
    menu = [
      { id: 'kpis', label: '📊 KPIs Nacionales', section: 'Métricas Globales' },
      { id: 'averias', label: '📥 Captura de Averías', section: 'Operaciones' },
      { id: 'ordenes', label: '📝 Órdenes de Trabajo', section: 'Operaciones' },
      { id: 'usuarios', label: '👥 Personal de Cuadrillas', section: 'Configuración' }
    ];
  } else if (SESSION.role === 'gerente_zona') {
    menu = [
      { id: 'zona-view', label: '📈 Dashboard Operativo', section: 'Métricas Zonal' },
      { id: 'averias', label: '🔍 Averías Geográficas', section: 'Operaciones' },
      { id: 'ordenes', label: '📝 Órdenes de Trabajo', section: 'Operaciones' },
      { id: 'usuarios', label: '🛠️ Mis Técnicos', section: 'Configuración' }
    ];
  } else if (SESSION.role === 'tecnico') {
    menu = [
      { id: 'mis-tareas', label: '💼 Mis Tareas Asignadas', section: 'Frentes de Trabajo' },
      { id: 'averias-zona-tec', label: '📋 Historial de Averías', section: 'Consulta Local' }
    ];
  }
  
  let currentSec = '';
  menu.forEach((item, index) => {
    if (item.section !== currentSec) {
      currentSec = item.section;
      const lbl = document.createElement('div');
      lbl.className = 'sidebar-section-label';
      lbl.innerText = item.section;
      nav.appendChild(lbl);
    }
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.innerHTML = `<span>${item.label}</span>`;
    btn.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const sb = document.getElementById('sidebar');
      if(sb.classList.contains('open')) sb.classList.remove('open'); // Cierra en móviles al tocar
      renderView(item.id);
    };
    nav.appendChild(btn);
    
    // Forzar activación visual de la primera pestaña por defecto
    if (index === 0) {
      btn.classList.add('active');
    }
  });
  
  renderView(menu[0].id);
}

function renderView(viewId) {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  
  switch(viewId) {
    case 'kpis': renderNacionalKPIs(main); break;
    case 'zona-view': renderZonaDashboard(main); break;
    case 'averias': renderAveriasModulo(main); break;
    case 'ordenes': renderOrdenesModulo(main); break;
    case 'usuarios': renderUsuariosModulo(main); break;
    case 'mis-tareas': renderTecnicoModulo(main); break;
    case 'averias-zona-tec': renderAveriasSoloLectura(main); break;
  }
}

        <div class="kpi-card kpi-good"><div class="kpi-label">Cumplimiento Plan (CPP)</div><div class="kpi-value">96.0%</div><div style="font-size:11px;color:var(--green)">Meta ≥ 95%</div></div>

</div>

<div id="modal-container"></div>

<script>
/* ============================================================
   CONFIGURACIÓN FIREBASE & MOTOR DE DATOS SIMULTÁNEO
   ============================================================ */
const firebaseConfig = {
  databaseURL: "https://optinet-gpon-default-rtdb.firebaseio.com/" 
};

let rtdb = null;
try {
  if (firebase.apps.length === 0) {
    firebase.initializeApp(firebaseConfig);
  }
  rtdb = firebase.database();
} catch (e) {
  console.warn("Utilizando motor alterno local-realtime para persistencia distribuida.");
}

const ZONES = ['ALTAVISTA','EL CALLAO','EL GURI','LA SABANITA','PUERTO ORDAZ','UNARE','UPATA'];

const FAULT_CATEGORIES = {
  'LOS':  { label: 'Pérdida de Señal PON (LOS)', sev: 1, proc: 'MC-02', color: '#B71C1C' },
  'CORTE':{ label: 'Corte de Cable', sev: 1, proc: 'MC-03', color: '#B71C1C' },
  'OLT_FALLA': { label: 'Falla Total OLT', sev: 1, proc: 'MC-01', color: '#B71C1C' },
  'NNV':  { label: 'No Navega (NNV)', sev: 2, proc: 'MC-04', color: '#C62828' },
  'NONAV':{ label: 'Sin Navegación (NONAV)', sev: 2, proc: 'MC-04', color: '#E65100' },
  'TELIP': { label: 'Falla Telefonía IP', sev: 3, proc: 'MC-04', color: '#0277BD' },
  'ONT_DANADO': { label: 'ONT Dañada', sev: 4, proc: 'MC-04', color: '#F57F17' },
  'NL':   { label: 'Navega Lento (NL)', sev: 5, proc: 'MC-05', color: '#9C27B0' },
  'DEGRAD': { label: 'Degradación de Señal', sev: 5, proc: 'MC-05', color: '#6A1B9A' }
};

let DB = {
  users: [
    {user:'admin', pass:'admin123', role:'admin', name:'Gerente General', zona:'Todas'},
    {user:'gerente_unare', pass:'gerente123', role:'gerente_zona', name:'Gerente Zonal Unare', zona:'UNARE'},
    {user:'tecnico1', pass:'tec123', role:'tecnico', name:'José Rangel', zona:'UNARE'}
  ],
  averias: [],
  ordenes: []
};

let SESSION = null;

function syncData(action = 'pull', callback = null) {
  if (rtdb) {
    if (action === 'push') {
      rtdb.ref('optinet_db').set(DB);
    } else {
      rtdb.ref('optinet_db').on('value', snapshot => {
        const data = snapshot.val();
        if (data) {
          DB = data;
          if (callback) callback();
        }
      });
    }
  } else {
    if (action === 'push') {
      localStorage.setItem('optinet_local_db', JSON.stringify(DB));
    } else {
      const local = localStorage.getItem('optinet_local_db');
      if (local) DB = JSON.parse(local);
      if (callback) callback();
    }
  }
}

/* ============================================================
   AUTENTICACIÓN Y FILTRADO JERÁRQUICO DE ROLES
   ============================================================ */
function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  
  const found = DB.users.find(x => x.user === u && x.pass === p);
  if (!found) { alert('Credenciales inválidas o desincronización de nodo.'); return; }
  
  SESSION = found;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  document.getElementById('header-name').textContent = found.name;
  
  let roleText = 'Técnico de Zona';
  if (found.role === 'admin') roleText = 'Gerente General (Nacional)';
  if (found.role === 'gerente_zona') roleText = `Gerente de Zona — ${found.zona}`;
  document.getElementById('header-role').textContent = roleText;
  
  buildHierarchicalMenu();
}

function doLogout() {
  SESSION = null;
  location.reload();
}

function buildHierarchicalMenu() {
  const nav = document.getElementById('nav-items');
  nav.innerHTML = '';
  
  let menu = [];
  if (SESSION.role === 'admin') {
    menu = [
      { id: 'kpis', label: 'KPIs Nacionales', section: 'Métricas Globales' },
      { id: 'averias', label: 'Captura de Averías', section: 'Operaciones' },
      { id: 'ordenes', label: 'Órdenes de Trabajo', section: 'Operaciones' },
      { id: 'usuarios', label: 'Estructura Organizacional', section: 'Seguridad' }
    ];
  } else if (SESSION.role === 'gerente_zona') {
    menu = [
      { id: 'zona-view', label: 'Dashboard Operativo', section: 'Métricas Zonal' },
      { id: 'averias', label: 'Averías de la Zona', section: 'Operaciones' },
      { id: 'ordenes', label: 'Órdenes de Trabajo', section: 'Operaciones' },
      { id: 'usuarios', label: 'Gestión de Cuadrillas', section: 'Seguridad' }
    ];
  } else if (SESSION.role === 'tecnico') {
    menu = [
      { id: 'mis-tareas', label: 'Mis Tareas Asignadas', section: 'Flujo de Trabajo' },
      { id: 'averias-zona-tec', label: 'Panel de Fallas Comunes', section: 'Consulta' }
    ];
  }
  
  let currentSec = '';
  menu.forEach(item => {
    if (item.section !== currentSec) {
      currentSec = item.section;
      const lbl = document.createElement('div');
      lbl.className = 'sidebar-section-label';
      lbl.style.padding = '10px 16px 4px';
      lbl.innerText = item.section;
      nav.appendChild(lbl);
    }
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.innerHTML = `<span>${item.label}</span>`;
    btn.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderView(item.id);
    };
    nav.appendChild(btn);
  });
  
  renderView(menu[0].id);
}

function renderView(viewId) {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  
  switch(viewId) {
    case 'kpis': renderNacionalKPIs(main); break;
    case 'zona-view': renderZonaDashboard(main); break;
    case 'averias': renderAveriasModulo(main); break;
    case 'ordenes': renderOrdenesModulo(main); break;
    case 'usuarios': renderUsuariosModulo(main); break;
    case 'mis-tareas': renderTecnicoModulo(main); break;
    case 'averias-zona-tec': renderAveriasSoloLectura(main); break;
  }
}

/* ============================================================
   MÓDULO: RESTRICCIÓN JERÁRQUICA DE VISTAS Y KPIS
   ============================================================ */
function renderNacionalKPIs(c) {
  c.innerHTML = `
    <div class="card">
      <h2 style="margin-bottom:4px; color:var(--blue-dark)">Cuadro de Mando Corporativo (Nacional)</h2>
      <p style="color:var(--txt-muted); font-size:13px; margin-bottom:20px;">Indicadores globales y de macro-calidad estratégica de la red.</p>
      
      <div class="kpi-grid">
        <div class="kpi-card kpi-good"><div class="kpi-label">Disponibilidad Global</div><div class="kpi-value">99.64%</div><div style="font-size:11px;color:var(--green)">Meta ≥ 99.5%</div></div>
        <div class="kpi-card kpi-good"><div class="kpi-label">MTBF Consolidado</div><div class="kpi-value">745 h</div><div style="font-size:11px;color:var(--green)">Meta ≥ 720 h</div></div>
        <div class="kpi-card kpi-good"><div class="kpi-label">MTTR Nacional</div><div class="kpi-value">3.15 h</div><div style="font-size:11px;color:var(--green)">Meta ≤ 4 h</div></div>
        <div class="kpi-card kpi-good"><div class="kpi-label">Cumplimiento Plan (CPP)</div><div class="kpi-value">96.0%</div><div style="font-size:11px;color:var(--green)">Meta ≥ 95%</div></div>
      </div>
      
      <div style="max-width:550px; margin-top:24px;">
        <h3 style="margin-bottom:12px; font-size:14px;">Distribución de Averías Abiertas por Frente Geográfico</h3>
        <canvas id="chart-nacional-zonas" height="180"></canvas>
      </div>
    </div>
  `;
  
  setTimeout(() => {
    new Chart(document.getElementById('chart-nacional-zonas'), {
      type: 'bar',
      data: {
        labels: ZONES,
        datasets: [{ label: 'Averías Activas', data: [3, 2, 1, 4, 2, 5, 1], backgroundColor: '#0033A0', borderRadius: 4 }]
      },
      options: { plugins: { legend: { display: false } } }
    });
  }, 100);
}

function renderZonaDashboard(c) {
  const z = SESSION.zona;
  const totalZonal = DB.averias.filter(a => a.zona === z).length;
  const criticas = DB.averias.filter(a => a.zona === z && parseInt(a.severidad) <= 2).length;
  
  c.innerHTML = `
    <div class="card">
      <h2 style="color:var(--blue-dark)">Mando de Operaciones Técnicas — Región ${z}</h2>
      <p style="color:var(--txt-muted); font-size:13px; margin-bottom:20px;">Monitoreo táctico directo de la zona asignada.</p>
      
      <div class="kpi-grid">
        <div class="kpi-card" style="border-left-color:var(--blue)"><div class="kpi-label">Averías en la Región</div><div class="kpi-value">${totalZonal}</div></div>
        <div class="kpi-card kpi-bad"><div class="kpi-label">Casos Críticos / Mayores</div><div class="kpi-value">${criticas}</div></div>
        <div class="kpi-card" style="border-left-color:var(--orange)"><div class="kpi-label">Órdenes Pendientes</div><div class="kpi-value">${DB.ordenes.filter(o => o.zona === z && o.estado !== 'Completada').length}</div></div>
      </div>
      
      <div style="margin-top:20px; padding:15px; background:#F4F7FC; border-radius:8px; border:1px solid var(--border);">
        <h4 style="margin-bottom:4px; font-size:13px; color:var(--blue-dark)">Restricción de Privacidad Operativa</h4>
        <p style="font-size:12px; color:var(--txt-muted);">Los índices de macro-calidad global de infraestructura centralizada (MTBF, MTTR País, Disponibilidad Consolidada) se encuentran bajo resguardo de visualización del Administrador Nacional.</p>
      </div>
    </div>
  `;
}

/* ============================================================
   MÓDULO: PROCESAMIENTO COMPLETO DE MATRIZ DE AVERÍAS (EXCEL)
   ============================================================ */
function renderAveriasModulo(c) {
  const isGlobal = SESSION.role === 'admin';
  const zonaFiltro = isGlobal ? '' : SESSION.zona;
  let listado = isGlobal ? DB.averias : DB.averias.filter(a => a.zona === zonaFiltro);
  
  c.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div>
          <h2 style="color:var(--blue-dark)">Ingesta Absoluta de Matrices de Avería</h2>
          <p style="color:var(--txt-muted); font-size:12px;">Filtro de visualización: ${isGlobal ? 'Consolidado General' : 'Región Terreno ' + zonaFiltro}</p>
        </div>
      </div>

      <div style="background:#F0F4FF; padding:16px; border-radius:8px; margin-bottom:20px;">
        <h4 style="margin-bottom:6px; font-size:13px;">Cargar Reporte Consolidado de Red (.xlsx)</h4>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <input type="file" id="excel-ingesta-file" accept=".xlsx, .xls" style="font-size:13px;">
          <button class="btn btn-primary btn-sm" onclick="procesarMatrizAveriasExcel()">Procesar Todo Sin Omisiones</button>
        </div>
        <span id="conteo-ingesta-status" style="display:block; margin-top:8px; font-weight:700; font-size:12px; color:var(--green)"></span>
      </div>

      <div style="margin-bottom:15px;">
        <button class="btn btn-orange btn-sm" onclick="ejecutarAsignacionMasivaZonal()">Asignación en Bloque a Técnicos de Zona</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th width="30"><input type="checkbox" id="select-all-averias-check" onclick="toggleSeleccionAveriasLote(this)"></th>
              <th>ID Avería</th>
              <th>Abonado</th>
              <th>Zona</th>
              <th>Problema Detectado</th>
              <th>Caja FAT / CTO</th>
              <th>Severidad</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-cuerpo-averias">
            ${listado.length === 0 ? '<tr><td colspan="8" style="text-align:center; color:var(--txt-muted);">No se detectan averías en memoria. Inyecte un reporte Excel para inicializar operaciones.</td></tr>' : 
              listado.map(a => `
                <tr>
                  <td><input type="checkbox" class="check-averia-individual" data-id="${a.id_averia}"></td>
                  <td><strong>${a.id_averia}</strong></td>
                  <td>${a.nombre || 'Abonado General'}</td>
                  <td><span class="pill" style="background:#E3F2FD; color:var(--blue-dark)">${a.zona}</span></td>
                  <td>${a.problema_reporte}</td>
                  <td>${a.fat || 'N/A'}</td>
                  <td><span class="pill" style="background:${FAULT_CATEGORIES[a.tipo_problema]?.color || '#666'}15; color:${FAULT_CATEGORIES[a.tipo_problema]?.color || '#666'}">Nivel ${a.severidad}</span></td>
                  <td><span class="pill ${a.estado_gestion === 'Abierta' ? 'pill-pend' : 'pill-done'}">${a.estado_gestion}</span></td>
                </tr>
              `).join('')
            }
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ALGORITMO DE BARRIDO ABSOLUTO FILA POR FILA (Corrige el error de omisión de celdas)
function procesarMatrizAveriasExcel() {
  const fileInput = document.getElementById('excel-ingesta-file');
  if (!fileInput.files.length) { alert('Cargue el archivo .xlsx de averías estructuradas.'); return; }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = e.target.result;
    const workbook = XLSX.read(data, { type: 'binary' });
    const sheetName = workbook.SheetNames[0];
    const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });
    
    let ingresados = 0;
    for (let i = 0; i < jsonRows.length; i++) {
      const row = jsonRows[i];
      const idStr = String(row.id_averia || "").trim();
      
      if (!idStr) continue; 
      if (DB.averias.some(a => a.id_averia === idStr)) continue;
      
      const prob = String(row.tipo_problema || "NNV").trim().toUpperCase();
      const catInfo = FAULT_CATEGORIES[prob] || FAULT_CATEGORIES["NNV"];
      
      DB.averias.push({
        id_averia: idStr,
        nombre: row.nombre || "Abonado General",
        zona: String(row.zona || "UNARE").trim().toUpperCase(),
        problema_reporte: row.problema_reporte || row.descripcion || "Falla No Especificada",
        tipo_problema: prob,
        olt: row.olt || "Nodo General",
        puerto: row.puerto || "1",
        fat: row.fat || "CTO-G",
        severidad: catInfo.sev,
        estado_gestion: 'Abierta',
        asignado_a: '',
        telefono: row.telefono || 'N/A',
        direccion: row.direccion || 'N/A'
      });
      ingresados++;
    }
    
    syncData('push');
    document.getElementById('conteo-ingesta-status').innerText = `¡Ingesta Completa! +${ingresados} filas procesadas y resguardadas con éxito.`;
    setTimeout(() => renderView('averias'), 1300);
  };
  reader.readAsBinaryString(fileInput.files[0]);
}

function toggleSeleccionAveriasLote(master) {
  document.querySelectorAll('.check-averia-individual').forEach(c => c.checked = master.checked);
}

function ejecutarAsignacionMasivaZonal() {
  const checkboxes = document.querySelectorAll('.check-averia-individual:checked');
  if (!checkboxes.length) { alert('Seleccione las averías de la matriz a distribuir.'); return; }
  
  let targetZona = SESSION.zona;
  if (SESSION.role === 'admin') {
    const promptZona = prompt(`Introduzca la zona geográfica destino para este lote (${ZONES.join(', ')}):`, 'UNARE');
    if (!promptZona) return;
    targetZona = promptZona.toUpperCase().trim();
  }
  
  const técnicos = DB.users.filter(u => u.role === 'tecnico' && u.zona === targetZona);
  if (!técnicos.length) { alert(`No existen perfiles de técnicos registrados en OPTINET para la zona: ${targetZona}`); return; }
  
  let totalAsignadas = 0;
  checkboxes.forEach((cb, idx) => {
    const idAv = cb.dataset.id;
    const avObj = DB.averias.find(a => a.id_averia === idAv);
    
    if (avObj && avObj.estado_gestion === 'Abierta') {
      const tecAsignado = técnicos[idx % técnicos.length];
      avObj.asignado_a = tecAsignado.user;
      
      const catInfo = FAULT_CATEGORIES[avObj.tipo_problema] || FAULT_CATEGORIES["NNV"];
      const otId = 'OT-' + String(DB.ordenes.length + 1).padStart(3, '0');
      
      DB.ordenes.push({
        id: otId,
        tipo: 'Correctivo',
        actividad: catInfo.proc,
        zona: targetZona,
        tecnico: tecAsignado.user,
        fat: avObj.fat,
        estado: 'Pendiente',
        fecha: new Date().toISOString().slice(0, 10),
        averia_id: idAv,
        detalle: `Falla distribuida masivamente: ${avObj.problema_reporte}`
      });
      totalAsignadas++;
    }
  });
  
  syncData('push');
  alert(`Distribución masiva ejecutada: ${totalAsignadas} Órdenes creadas e inyectadas en terreno.`);
  renderView('averias');
}

        <div class="planilla-row-item"><span>Estructura Física e Integridad de la Caja (FAT/CTO)</span><div class="planilla-ok-nok"><label><input type="radio" name="p1" value="OK" checked> OK</label><label><input type="radio" name="p1" value="NOK"> NOK</label></div></div>

        <div class="planilla-row-item"><span>Verificación de Tapas Contra Polvo en Puertos Libres</span><div class="planilla-ok-nok"><label><input type="radio" name="p4" value="OK" checked> OK</label><label><input type="radio" name="p4" value="NOK"> NOK</label></div></div>
      </div>
      <div class="form-row">
        <div class="form-col"><label>Potencia Óptica Medida (dBm)</label><input type="text" id="form-p-pot" placeholder="Ej: -20.1" required></div>
        <div class="form-col"><label>Atenuación del Enlace Probeta (dB)</label><input type="text" id="form-p-att" placeholder="Ej: 0.03" required></div>
      </div>
      <div class="form-row">
        <div class="form-col"><label>Diagnóstico y Notas de Campo</label><textarea id="form-p-obs" rows="2"></textarea></div>
      </div>
      <button class="btn btn-green btn-lg" onclick="procesarCierreFormularioOriginal('${idOt}', 'Preventivo')">Estampar Firma y Transmitir</button>
    `);

    const av = DB.averias.find(a => a.id_averia === o.averia_id) || {};
    showModalHTML(cont, `Mantenimiento Correctivo · Formato OT-GPON-001`, `
      <div style="background:#FFF3E0; padding:10px; border-radius:6px; margin-bottom:12px; font-size:12px;">
        <strong>Abonado Afectado:</strong> ${av.nombre || 'Cliente General'} | <strong>Ubicación:</strong> ${av.direccion || 'N/A'}
      </div>
      <div class="form-row">
        <div class="form-col">
          <label>Causa Raíz Diagnosticada</label>
          <select id="form-c-causa" required>
            <option>Conector óptico contaminado o sucio</option>
            <option>Atenuación por Macrocurvatura en drop</option>
            <option>Tramo de Cable Drop partido/dañado</option>
            <option>ONT Quemada / Desconfigurada</option>
          </select>
        </div>
        <div class="form-col">
          <label>Acción Técnico-Correctiva Ejecutada</label>
          <select id="form-c-accion" required>
            <option>Limpieza con Hilo e Isopropílico Pro</option>
            <option>Sustitución y Homologación de Nueva ONT</option>
            <option>Tendido e Hilado de Nuevo Tramo Drop</option>

          </select>
        </div>

        <div class="form-col"><label>Atenuación Entrada (dB)</label><input type="text" id="form-c-att-antes" placeholder="Ej: 0.50"></div>
        <div class="form-col"><label>Atenuación de Entrega (dB)</label><input type="text" id="form-c-att-despues" placeholder="Ej: 0.02"></div>
      </div>

        <div class="form-col">
          <label>Validación de Levantamiento de Portadora</label>

        </div>
      </div>

function showModalHTML(cont, title, body) {
  cont.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <div class="card-header"><h3 style="color:var(--blue-dark)">${title}</h3><button class="btn btn-sm btn-outline" onclick="document.getElementById('modal-container').innerHTML=''">X</button></div>
        <div>${body}</div>
      </div>
    </div>
  `;
}

function procesarCierreFormularioOriginal(idOt, tipo) {
  const o = DB.ordenes.find(x => x.id === idOt);
  if (!o) return;
  
  if (tipo === 'Preventivo') {
    o.resultado = `MP Completado — Potencia: ${document.getElementById('form-p-pot').value} dBm. Obs: ${document.getElementById('form-p-obs').value}`;
  } else {
    o.resultado = `MC Completado — Causa: ${document.getElementById('form-c-causa').value} | Acción: ${document.getElementById('form-c-accion').value}`;
    if (o.averia_id) {
      const av = DB.averias.find(a => a.id_averia === o.averia_id);
      if (av) av.estado_gestion = 'Cerrada';
    }
  }
  
  o.estado = 'Completada';
  syncData('push');
  document.getElementById('modal-container').innerHTML = '';
  alert('Formulario de ingeniería firmado y sincronizado inmediatamente.');
  renderView('mis-tareas');
}

function guardarNuevoUsuarioSincronizado() {
  const u = document.getElementById('nu-user').value.trim();

  const n = document.getElementById('nu-name').value.trim();
  const z = document.getElementById('nu-zona').value;

  DB.users.push({ user: u, pass: p, name: n, role: 'tecnico', zona: z });

  alert(`Técnico ${u} dado de alta y replicado en todos los terminales.`);

}
